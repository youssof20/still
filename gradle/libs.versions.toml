# Verified 2026-09-21:
# - AGP 9.4.0 supports compileSdk 37; requires Gradle 9.6.0 (AGP 9.4 release notes)
# - Compose BOM 2026.08.00 / Compose 1.12 requires compileSdk 37 and AGP 9
# - AGP 9 built-in Kotlin replaces org.jetbrains.kotlin.android
# - Kotlin Gradle plugin 2.2.10 matches AGP 9's documented default KGP
# - Room 2.8.5 (Apache-2.0) for local task persistence; KSP matches Kotlin 2.2.10
# - Robolectric 4.16 (Apache-2.0) for Room schema/migration unit tests only
[versions]
agp = "9.4.0"
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"
composeBom = "2026.08.00"
activityCompose = "1.12.0"
lifecycleRuntime = "2.9.4"
coreKtx = "1.17.0"
datastorePreferences = "1.1.7"
room = "2.8.5"
robolectric = "4.16"
androidxTestCore = "1.7.0"
junit = "4.13.2"
truth = "1.4.4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntime" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntime" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntime" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
